name: SSH plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_CLI_VERSION: "0.1.3"

jobs:
  validate:
    name: Validate repository contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 scripts/validate_repo.py
      - run: node scripts/connection-forms/verify.mjs

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build

  backend:
    name: Rust sidecar checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev nasm
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path backend/Cargo.toml

  smoke:
    name: Offline MCP smoke
    needs: [validate, backend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev nasm
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --manifest-path backend/Cargo.toml
      - run: python3 scripts/smoke_mcp.py --binary backend/target/release/dbx-plugin-ssh

  candidate:
    name: Linux candidate package
    needs: [validate, frontend, backend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev nasm
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --global "@dbx-app/plugin-cli@${PLUGIN_CLI_VERSION}"
      - env:
          DBX_PLUGIN_TARGET: linux-x64
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-ssh-linux-x64
          if-no-files-found: error
          path: |
            dist/*.dbxp
            dist/*.artifact.json
