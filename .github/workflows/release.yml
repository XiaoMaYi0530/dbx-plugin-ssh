name: Release DBX SSH plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  validate:
    if: startsWith(github.event.release.tag_name, 'ssh-v')
    name: Validate SSH release identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/validate_repo.py
          python3 - "$RELEASE_TAG" <<'PY'
          import json
          import pathlib
          import sys
          version = json.loads(pathlib.Path("manifest.json").read_text())["version"]
          expected = f"ssh-v{version}"
          if sys.argv[1] != expected:
              raise SystemExit(f"release tag {sys.argv[1]!r} does not match {expected!r}")
          PY

  release:
    if: startsWith(github.event.release.tag_name, 'ssh-v')
    needs: validate
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@main
    with:
      release-tag: ${{ github.event.release.tag_name }}
      working-directory: .
      package-command: AWS_LC_SYS_PREBUILT_NASM=1 dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.3
      # One native runner per target — matches the CI candidate matrix.
      build-matrix: >-
        {"include":[{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"},{"runner":"windows-2022","target":"windows-x64"},{"runner":"macos-15-intel","target":"darwin-x64"},{"runner":"macos-15","target":"darwin-arm64"}]}
