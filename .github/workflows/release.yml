name: Release DBX SSH plugin

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  PLUGIN_CLI_VERSION: "0.1.3"
  # aws-lc-sys falls back to its bundled prebuilt NASM objects when the
  # assembler is missing on the MSVC toolchain; harmless on every other OS.
  AWS_LC_SYS_PREBUILT_NASM: "1"
  # Windows runners default python stdout to cp1252; UTF-8 mode is a no-op
  # on the other platforms.
  PYTHONUTF8: "1"

jobs:
  validate:
    if: startsWith(github.event.release.tag_name, 'ssh-v')
    name: Validate SSH release identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/validate_repo.py
          python3 - "$RELEASE_TAG" <<'PY'
          import json
          import pathlib
          import sys
          version = json.loads(pathlib.Path("manifest.json").read_text())["version"]
          expected = f"ssh-v{version}"
          if sys.argv[1] != expected:
              raise SystemExit(f"release tag {sys.argv[1]!r} does not match {expected!r}")
          PY

  build:
    if: startsWith(github.event.release.tag_name, 'ssh-v')
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 侧车全静态 musl 构建：glibc 构建在 ubuntu-24.04（2.39）上，
          # Ubuntu 22.04/Debian 11 等老系统动态加载器直接失败（exit status 1）。
          # rust_target 同时喂给 rustup targets 与 CARGO_BUILD_TARGET。
          - os: linux
            runner: ubuntu-24.04
            target: linux-x64
            rust_target: x86_64-unknown-linux-musl
          - os: linux
            runner: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-musl
          - os: macos
            runner: macos-15
            target: darwin-arm64
          - os: macos
            runner: macos-15-intel
            target: darwin-x64
          - os: windows
            runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        if: matrix.os == 'linux'
        # musl-tools 提供 musl-gcc：aws-lc-sys（russh 依赖）在 musl target 下
        # 仍要编译 C 源码。libdbus-1-dev / nasm 已移除：secret-service（dbus）
        # 在 Linux 被 cfg 门控掉（走 keyfile 层），nasm 只服务 aws-lc-sys 的
        # MSVC 预置对象路径。
        run: sudo apt-get update && sudo apt-get install -y pkg-config musl-tools
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      # CARGO_BUILD_TARGET 经环境变量传导（cargo 原生支持）：同时约束这里的
      # 预构建与 package 步骤里 CLI 内部的 cargo build（CLI 不传 --target）。
      # 非 linux 条目 RUST_TARGET 为空，保持默认主机 target。
      - name: Build sidecar
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          if [ -n "$RUST_TARGET" ]; then export CARGO_BUILD_TARGET="$RUST_TARGET"; fi
          cargo build --locked --release --manifest-path backend/Cargo.toml
      # CLI 打包时的拷贝源固定是 dist/.build-rust-<target>/release/（实测不受
      # CARGO_TARGET_DIR 影响），而带 CARGO_BUILD_TARGET 的 cargo 输出在
      # backend/target/<triple>/release/。把 musl 产物预放到 CLI 的拷贝源路径，
      # 否则打包报 "Failed to copy Rust backend ... No such file or directory"；
      # 裸 backend/target/release/ 兜底保留，打包后的静态校验会抓住任何走错
      # 路径的情况。
      - name: Stage musl binary at the CLI's expected path
        if: matrix.os == 'linux'
        run: |
          mkdir -p backend/target/release "dist/.build-rust-${{ matrix.target }}/release"
          cp -f "backend/target/${{ matrix.rust_target }}/release/dbx-plugin-ssh" backend/target/release/dbx-plugin-ssh
          cp -f "backend/target/${{ matrix.rust_target }}/release/dbx-plugin-ssh" "dist/.build-rust-${{ matrix.target }}/release/dbx-plugin-ssh"
      - run: npm install --global "@dbx-app/plugin-cli@${PLUGIN_CLI_VERSION}"
      - name: Package .dbxp candidate
        # CARGO_TARGET_DIR points the CLI's own cargo build at the warm
        # backend/target from the step above instead of a throwaway staging dir.
        env:
          DBX_PLUGIN_TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust_target }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/backend/target
          NO_COLOR: "1"
        run: |
          if [ -n "$RUST_TARGET" ]; then export CARGO_BUILD_TARGET="$RUST_TARGET"; fi
          dbx-plugin package .
      # 出货前把关：包内 Linux 二进制必须全静态（glibc 地板修复），
      # 动态链接即失败——不允许带病发布。
      - name: Verify packaged linux binary is statically linked
        if: matrix.os == 'linux'
        run: |
          pkg="$(ls -t dist/*.dbxp | head -1)"
          tmp="$(mktemp -d)"
          unzip -q "$pkg" -d "$tmp"
          bin="$(find "$tmp/bin" -type f -name dbx-plugin-ssh | head -1)"
          [ -n "$bin" ] || { echo "FAIL: packaged dbx-plugin-ssh binary missing under $tmp/bin"; exit 1; }
          file "$bin"
          if file "$bin" | grep -q "dynamically linked"; then
            echo "FAIL: packaged linux binary is dynamically linked; expected a static musl build" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/*.dbxp
            dist/*.artifact.json

  publish:
    if: startsWith(github.event.release.tag_name, 'ssh-v')
    name: Publish plugin release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dbx-plugin-*
          path: dist
          merge-multiple: true
      - name: Validate candidates and merge metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/check_candidates.py dist \
            --expect linux-x64,linux-arm64,darwin-arm64,darwin-x64,windows-x64 \
            --write-release-candidates dist/release-candidates.json
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mapfile -d '' packages < <(find dist -type f -name '*.dbxp' -print0)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No .dbxp packages were downloaded" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${packages[@]}" dist/release-candidates.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
